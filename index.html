<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor RMN - EdTech com IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake-err { animation: shake 0.4s ease-in-out; }

        /* Espetro CSS */
        .spectrum-container {
            position: relative; width: 100%; height: 120px;
            border-bottom: 2px solid #4b5563;
            background: linear-gradient(to top, rgba(16, 185, 129, 0.05), transparent);
        }
        .axis-label { position: absolute; bottom: -25px; transform: translateX(-50%); font-size: 0.75rem; color: #9ca3af; }
        .signal-peak {
            position: absolute; bottom: 0; width: 4px; background-color: #10b981;
            transform: translateX(-50%); cursor: pointer; transition: all 0.2s; border-radius: 2px 2px 0 0; z-index: 5;
        }
        .signal-peak:hover { background-color: #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, 0.8); width: 6px; }
        .peak-c13 { background-color: #60a5fa; }
        .peak-c13:hover { background-color: #93c5fd; box-shadow: 0 0 10px rgba(147, 197, 253, 0.8); }

        .tooltip {
            visibility: hidden; position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
            background-color: #1f2937; color: #fff; padding: 8px 12px; border-radius: 6px;
            font-size: 0.875rem; white-space: nowrap; z-index: 10; border: 1px solid #374151;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.2s; pointer-events: none;
        }
        .signal-peak:hover .tooltip { visibility: visible; opacity: 1; }

        /* Drag & Drop */
        .draggable-tag { 
            cursor: grab; transition: transform 0.1s; 
            touch-action: none;
        }
        .draggable-tag:active { cursor: grabbing; transform: scale(0.95); }
        .dropzone { transition: all 0.2s ease; }
        .dropzone.drag-over { background-color: rgba(59, 130, 246, 0.3); border-color: #3b82f6; }
        
        /* Chat da IA */
        .chat-bubble { max-width: 85%; }
        .chat-bubble-ai { background-color: #374151; color: #e5e7eb; border-bottom-left-radius: 2px; }
        .chat-bubble-user { background-color: #059669; color: #ffffff; border-bottom-right-radius: 2px; align-self: flex-end; }
        .typing-indicator span {
            display: inline-block; width: 6px; height: 6px; background-color: #9ca3af; border-radius: 50%; margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex flex-col overflow-hidden relative">

    </main>

        const db = {

                    level: 1, title: "1ª Ordem: Fundamentos Vetoriais", 
                    content: `
                        <p class="mb-4 text-gray-300">RMN é dedução lógica, não memorização bruta. Foque em três eixos no 1H RMN:</p>
                        <ul class="space-y-4">
                            <li class="bg-gray-800 p-4 rounded border border-gray-700"><strong class="text-emerald-400 block mb-1">1. Deslocamento (δ em ppm):</strong> Alifáticos (sp3) ficam entre 0.8 - 2.0 ppm. Adjacência a heteroátomos (O, N, Cl) desblinda o núcleo puxando os eletrões, atirando o sinal para 3.1 - 4.3 ppm. Aromáticos ressoam longe, entre 6.5 - 8.5 ppm devido à corrente de anel.</li>
                            <li class="bg-gray-800 p-4 rounded border border-gray-700"><strong class="text-blue-400 block mb-1">2. Integração:</strong> A área indica a proporção de prótons. 3H quase sempre acusa um grupo Metil (-CH3). 2H acusa um Metileno (-CH2-).</li>
                            <li class="bg-gray-800 p-4 rounded border border-gray-700"><strong class="text-purple-400 block mb-1">3. Multiplicidade (n+1):</strong> Indica os vizinhos. Um tripleto (3 picos) significa que há 2 hidrogénios no carbono ao lado. Um dubleto (2 picos) acusa 1 vizinho.</li>
                        </ul>`

                    level: 2, title: "13C e a Ferramenta DEPT",

                        <div class="grid md:grid-cols-3 gap-4">
                            <div class="bg-gray-800 p-4 rounded border border-gray-700 text-center"><span class="text-xl font-bold text-gray-100 block mb-2">DEPT-45</span><p class="text-sm text-gray-400">Todos os carbonos protonados (CH, CH2, CH3) aparecem positivos. Quaternários ficam mudos.</p></div>
                            <div class="bg-gray-800 p-4 rounded border border-gray-700 text-center"><span class="text-xl font-bold text-blue-400 block mb-2">DEPT-90</span><p class="text-sm text-gray-400">Somente grupos Metinos (CH) aparecem. O resto evapora.</p></div>
                            <div class="bg-gray-800 p-4 rounded border border-gray-700 text-center"><span class="text-xl font-bold text-purple-400 block mb-2">DEPT-135</span><p class="text-sm text-gray-400">CH e CH3 ficam <strong>Positivos</strong> (pico para cima). CH2 sofre inversão e fica <strong>Negativo</strong> (pico para baixo).</p></div>
                        </div>`

                {

                            <li class="bg-gray-800 p-4 rounded border-l-4 border-red-500"><strong class="text-red-400 block mb-1">Sistemas AA'BB':</strong> Falsos dubletos em anéis aromáticos para-dissubstituídos. Apresentam o "Efeito Telhado" (picos internos maiores que externos).</li>
                            <li class="bg-gray-800 p-4 rounded border-l-4 border-yellow-500"><strong class="text-yellow-400 block mb-1">Prótons Diastereotópicos:</strong> Um simples -CH2- próximo a um centro quiral perde a equivalência. Os dois hidrogénios ganham frequências distintas e acoplam entre si com J geminal violento (aprox -14 Hz), gerando multipletos caóticos onde se esperava um sinal simples.</li>

                                <span class="mt-4">CH<sub class="text-sm">2</sub></span>
                            </div>
                            <div class="w-8 h-1 bg-gray-500 mx-2 mt-4"></div>
                            <div class="flex flex-col items-center relative">
                                <span class="absolute -top-10 bg-blue-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-sm font-sans shadow-md">3</span>

            solo: [

                    level: 1, title: "Leitura de Esqueleto 1H",
                    context: "Fórmula: C8H10. O clássico mono-aromático. Avalie ppm, proporção e acoplamento simultaneamente.",
                    spectra: {

                                { ppm: 1.2, mult: "Tripleto", int: "3H", height: 60, J: "7.5 Hz" },
                                { ppm: 2.6, mult: "Quarteto", int: "2H", height: 40, J: "7.5 Hz" },

                    spectra: {
                        '1H': {

                            signals: [
                                { ppm: 3.8, mult: "Singleto", int: "3H", height: 90, J: "-" },
                                { ppm: 7.0, mult: "Dubleto Aparente", int: "2H", height: 50, J: "8.5 Hz" },
                                { ppm: 7.8, mult: "Dubleto Aparente", int: "2H", height: 50, J: "8.5 Hz" },

        // --- FUNÇÕES DE ESTADO DA APLICAÇÃO ---
        function updateXP(amount) {
            state.xp += amount;
            const xpEl = document.getElementById('xp-counter');
            xpEl.innerText = `${state.xp} XP`;
            xpEl.classList.add('text-yellow-400', 'scale-[1.3]');
            setTimeout(() => xpEl.classList.remove('text-yellow-400', 'scale-[1.3]'), 300);
        }

        function setView(viewName, mode = null, level = 1) {
            state.currentView = viewName;
            if (mode) state.activeMode = mode;
            if (level) state.currentLevel = level;
            state.errors = 0;
            state.activeSpectrumType = '1H';
            render();
        }

        // --- LÓGICA DO ASSISTENTE IA (GEMINI API) ---
        const geminiSystemPrompt = "Atue como um Professor Senior de Química Orgânica focado em RMN (Ressonância Magnética Nuclear). Você está ajudando um aluno que está jogando um jogo educacional. Seu tom deve ser empático, direto, jovem e encorajador. Dê dicas baseadas em conceitos reais (deslocamento, integração, multiplicidade n+1, Karplus), mas NÃO DÊ A RESPOSTA FINAL DIRETAMENTE se o aluno estiver numa missão, guie-o até ela (técnica socrática). Formate sua resposta usando markdown básico (*negrito*). Mantenha as respostas bem curtas (no máximo 1 ou 2 parágrafos curtos).";

        async function fetchWithBackoff(url, options, maxRetries = 3) {
            let retries = 0;
            let delay = 1000;
            while (retries < maxRetries) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok && response.status === 429) {
                        throw new Error('Throttled by API');
                    }
                    return response;
                } catch (error) {
                    retries++;
                    if (retries >= maxRetries) return null;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2; // Exponential backoff (1s, 2s, 4s...)
                }
            }
        }

        function toggleAIChat() {
            const chatWindow = document.getElementById('ai-chat-window');
            state.chatOpen = !state.chatOpen;
            if (state.chatOpen) {
                chatWindow.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
                chatWindow.classList.add('scale-100', 'opacity-100', 'pointer-events-auto');
            } else {
                chatWindow.classList.remove('scale-100', 'opacity-100', 'pointer-events-auto');
                chatWindow.classList.add('scale-0', 'opacity-0', 'pointer-events-none');
            }
        }

        function addMessageToChat(text, sender) {
            const messagesContainer = document.getElementById('ai-chat-messages');
            
            // Remove typing indicator se existir
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();

            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-bubble p-3 rounded-2xl text-sm shadow-sm fade-in ${sender === 'user' ? 'chat-bubble-user rounded-br-none' : 'chat-bubble-ai rounded-bl-none'}`;
            
            // Simple markdown parser for bold
            const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

        async function sendAIMessage() {
            const input = document.getElementById('ai-chat-input');
            const message = input.value.trim();
            if (!message) return;

            addMessageToChat(message, 'user');
            input.value = '';
            showTypingIndicator();

            // Montar contexto dinâmico do nível atual para a IA entender onde o aluno está
            let dynamicContext = "";
            if (state.currentView === 'gameplay' && state.activeMode) {
                const currentData = db[state.activeMode].find(q => q.level === state.currentLevel);
                if (currentData) {
                    dynamicContext = `\n\n[CONTEXTO OCULTO DO SISTEMA - NÃO MENCIONE ISSO A MENOS QUE NECESSÁRIO: O aluno está no Modo ${state.activeMode}, Nível ${state.currentLevel}. O problema atual é: "${currentData.context}". Sinais fornecidos no espectro: ${JSON.stringify(currentData.signals || currentData.spectra)}. As opções disponíveis são: ${currentData.options ? JSON.stringify(currentData.options.map(o => o.text)) : 'Tags de arrastar'}. Lembre-se, guie sem dar a resposta direta.]`;
                }
            }

            state.chatHistory.push({ role: "user", parts: [{ text: message + dynamicContext }] });

            const payload = {
                contents: state.chatHistory,
                systemInstruction: { parts: [{ text: geminiSystemPrompt }] }
            };

            const apiKey = ""; // Mantido vazio conforme instrução do sistema Canvas
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const response = await fetchWithBackoff(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response && response.ok) {
                const result = await response.json();
                const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text || "Desculpe, meu espectrômetro pifou. Pode repetir?";
                state.chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                addMessageToChat(aiText, 'ai');
            } else {
                addMessageToChat("Erro de conexão no laboratório virtual. Tente novamente mais tarde.", 'ai');
                state.chatHistory.pop(); // Remove the user message that failed
            }
        }

        // --- COMPONENTE DE ESPETRO E GAMEPLAY ---
        function renderSpectrum(signals, maxPpm, is13C = false) {
            let axisHtml = '';
            const step = is13C ? 20 : 1;
            for (let i = 0; i <= maxPpm; i += step) {
                const leftPos = ((maxPpm - i) / maxPpm) * 100;
                axisHtml += `<div class="axis-label" style="left: ${leftPos}%">${i}</div>`;
            }

            let peaksHtml = '';
            const colorClass = is13C ? 'peak-c13' : '';
            signals.forEach(sig => {
                const leftPos = ((maxPpm - sig.ppm) / maxPpm) * 100;
                const isNegative = sig.height < 0;
                const absHeight = Math.abs(sig.height);
                const bottomStyle = isNegative ? `top: 100%; border-radius: 0 0 2px 2px;` : `bottom: 0;`;
                
                const tooltipHtml = is13C 
                    ? `<strong class="block text-blue-300">${sig.ppm} ppm</strong>${sig.mult}<br>${sig.label || ''}`
                    : `<strong class="block text-emerald-300">${sig.ppm} ppm</strong>Int: ${sig.int}<br>Mult: ${sig.mult}<br>J: ${sig.J || '-'}`;

                peaksHtml += `
                    <div class="signal-peak ${colorClass}" style="left: ${leftPos}%; height: ${absHeight}px; ${bottomStyle}">
                        <div class="tooltip">${tooltipHtml}</div>
                    </div>
                `;
            });

            const hasNegative = signals.some(s => s.height < 0);
            return `
                <div class="spectrum-container mt-6 mb-12 relative" ${hasNegative ? 'style="border-bottom: 1px dashed #4b5563;"' : ''}>
                    ${peaksHtml}
                    ${axisHtml}
                    ${hasNegative ? '<div class="absolute w-full h-[2px] bg-gray-600 top-full"></div>' : ''}
                </div>
            `;
        }

        // Drag functions
        window.dragStart = e => { e.dataTransfer.setData("text/plain", e.target.id); e.target.classList.add('opacity-50'); };
        window.dragEnd = e => e.target.classList.remove('opacity-50');
        window.allowDrop = e => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; };
        window.dragEnter = e => { if (e.currentTarget.classList.contains('dropzone')) e.currentTarget.classList.add('drag-over'); };
        window.dragLeave = e => { if (e.currentTarget.classList.contains('dropzone')) e.currentTarget.classList.remove('drag-over'); };
        
        window.drop = e => {
            e.preventDefault();
            const dropzone = e.currentTarget;
            dropzone.classList.remove('drag-over');
            if (!dropzone.classList.contains('dropzone')) return;

            const draggedId = e.dataTransfer.getData("text/plain");
            const draggedEl = document.getElementById(draggedId);
            const existingTag = dropzone.querySelector('.draggable-tag');
            
            if (existingTag && existingTag.id !== draggedId) {
                document.getElementById('tags-pool').appendChild(existingTag);
            }
            if (draggedEl) {
                dropzone.innerHTML = '';
                dropzone.appendChild(draggedEl);
            }
            checkMappingState();
        };

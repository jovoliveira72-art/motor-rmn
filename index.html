<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor RMN — Elucidação Espectral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0A0A;
  --bg-elev: #111111;
  --bg-elev-2: #161616;
  --line: #1F1F1F;
  --line-strong: #2A2A2A;
  --text: #EDEDED;
  --text-dim: #8A8A8A;
  --text-faint: #4A4A4A;
  
  /* Cores por modo */
  --mapping: #00D4FF;
  --mapping-dim: rgba(0, 212, 255, 0.15);
  --solo: #FFB800;
  --solo-dim: rgba(255, 184, 0, 0.15);
  --tutorial: #00E08E;
  --tutorial-dim: rgba(0, 224, 142, 0.15);
  
  --error: #FF5454;
  --success: #00E08E;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-strong); }

.serif { font-family: 'Fraunces', serif; }
.mono { font-family: 'JetBrains Mono', monospace; }

.app-shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}

/* Header com XP proeminente */
header {
  border-bottom: 1px solid var(--line);
  padding: 16px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg);
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 14px;
  cursor: pointer;
}

.brand-mark {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 20px;
  letter-spacing: -0.02em;
}

.brand-mark em {
  font-style: italic;
  color: var(--text-dim);
  font-weight: 300;
}

.brand-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* XP READOUT — GRANDE E VISÍVEL */
.xp-readout {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--bg-elev);
  border: 1px solid var(--line-strong);
  padding: 10px 20px;
  border-radius: 8px;
}

.xp-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--solo), #FF8C00);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  box-shadow: 0 0 20px var(--solo-dim);
}

.xp-info {
  display: flex;
  flex-direction: column;
}

.xp-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text-faint);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.xp-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 700;
  color: var(--solo);
  letter-spacing: -0.02em;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.xp-value.pulse {
  transform: scale(1.15);
  color: var(--text);
  text-shadow: 0 0 20px var(--solo);
}

main {
  flex: 1;
  overflow-y: auto;
  padding: 48px 32px 80px;
}

.view-container {
  max-width: 1100px;
  margin: 0 auto;
}

/* Animações */
.fade-in {
  animation: fadeIn 0.4s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.shake-err { animation: shake 0.4s ease-in-out; }

@keyframes successPulse {
  0% { transform: scale(1); box-shadow: 0 0 0 0 var(--success); }
  50% { transform: scale(1.02); box-shadow: 0 0 40px 10px var(--success); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 var(--success); }
}

.success-pulse { animation: successPulse 0.6s ease-out; }

/* HOME */
.home-header {
  padding-bottom: 48px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 48px;
}

.home-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-faint);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 24px;
}

.home-title {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: clamp(40px, 6vw, 68px);
  line-height: 1.02;
  letter-spacing: -0.03em;
  margin-bottom: 20px;
  max-width: 900px;
}

.home-title em {
  font-style: italic;
  color: var(--text-dim);
  font-weight: 300;
}

.home-sub {
  font-size: 16px;
  color: var(--text-dim);
  max-width: 580px;
  line-height: 1.55;
}

/* Progress bar global */
.global-progress {
  margin-top: 32px;
  padding: 20px 24px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.progress-bar {
  height: 8px;
  background: var(--bg);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--tutorial), var(--mapping), var(--solo));
  border-radius: 4px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Modes grid */
.modes-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
  border-top: 1px solid var(--line);
}

.mode-row {
  display: grid;
  grid-template-columns: 60px 1fr auto;
  gap: 32px;
  align-items: center;
  padding: 28px 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
  background: transparent;
  border-left: none;
  border-right: none;
  color: inherit;
  width: 100%;
  font-family: inherit;
  position: relative;
}

.mode-row::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: transparent;
  transition: background 0.2s;
}

.mode-row:hover::before {
  background: var(--accent-color, var(--text));
}

.mode-row:hover {
  background: var(--bg-elev);
}

.mode-row:hover .mode-arrow {
  transform: translateX(6px);
  color: var(--accent-color, var(--text));
}

.mode-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-faint);
  letter-spacing: 0.05em;
}

.mode-body h3 {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: 24px;
  letter-spacing: -0.01em;
  margin-bottom: 6px;
}

.mode-body p {
  font-size: 14px;
  color: var(--text-dim);
  max-width: 500px;
}

.mode-arrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  color: var(--text-faint);
  transition: all 0.2s;
}

.mode-row.tutorial { --accent-color: var(--tutorial); }
.mode-row.mapping { --accent-color: var(--mapping); }
.mode-row.solo { --accent-color: var(--solo); }

/* Submodes */
.submodes {
  grid-column: 2 / 4;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  padding: 8px 0 20px;
  border-bottom: 1px solid var(--line);
}

@media (max-width: 700px) {
  .submodes { grid-template-columns: 1fr; }
}

.submode-btn {
  background: var(--bg-elev);
  border: 1px solid var(--line-strong);
  padding: 16px 18px;
  text-align: left;
  cursor: pointer;
  transition: all 0.2s;
  color: inherit;
  font-family: inherit;
  border-radius: 6px;
}

.submode-btn:hover {
  border-color: var(--mapping);
  background: var(--mapping-dim);
  transform: translateY(-2px);
}

.submode-btn .tier-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--mapping);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 8px;
  display: block;
}

.submode-btn .tier-name {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  margin-bottom: 4px;
}

.submode-btn .tier-desc {
  font-size: 12px;
  color: var(--text-dim);
}

/* Sections */
.section-header {
  display: flex;
  align-items: baseline;
  gap: 20px;
  margin-bottom: 40px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}

.section-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-faint);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.section-title {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: 32px;
  letter-spacing: -0.02em;
}

.section-title em {
  font-style: italic;
  color: var(--text-dim);
}

.back-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 8px 0;
  transition: color 0.2s;
}

.back-btn:hover { color: var(--mapping); }
.back-btn::before { content: "← "; }

/* Tutorial */
.tutorial-body {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  line-height: 1.65;
  max-width: 680px;
  font-weight: 300;
}

.tutorial-body strong {
  color: var(--tutorial);
  font-weight: 500;
}

.tutorial-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}

.btn-text {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 12px 0;
  transition: color 0.2s;
}

.btn-text:hover { color: var(--text); }
.btn-text.primary { color: var(--tutorial); }
.btn-text.primary:hover { color: var(--text); }

/* Mapping */
.context-strip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.05em;
  padding: 12px 16px;
  background: var(--mapping-dim);
  border-left: 3px solid var(--mapping);
  margin-bottom: 32px;
  border-radius: 0 6px 6px 0;
}

.context-strip strong {
  color: var(--text);
  display: block;
  font-family: 'Fraunces', serif;
  font-size: 20px;
  font-weight: 400;
  margin-bottom: 4px;
  text-transform: none;
}

.instruction {
  font-size: 13px;
  color: var(--text-faint);
  margin-bottom: 24px;
  padding-left: 14px;
  border-left: 1px solid var(--line-strong);
}

/* Chain diagram */
.chain-diagram {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  padding: 40px 24px 48px;
  margin-bottom: 24px;
  overflow-x: auto;
  border-radius: 8px;
}

.chain-inner {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 0;
  min-width: max-content;
}

.chain-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
}

.chain-node-branches {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 8px;
  gap: 4px;
}

.chain-branch {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.chain-branch-line {
  width: 1px;
  height: 10px;
  background: var(--line-strong);
}

.chain-branch-box {
  background: var(--bg);
  border: 1px solid var(--line-strong);
  padding: 4px 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  position: relative;
  border-radius: 4px;
}

.chain-link {
  width: 24px;
  height: 1px;
  background: var(--line-strong);
  align-self: center;
  flex-shrink: 0;
  margin: 0 2px;
}

.chain-box {
  background: var(--bg);
  border: 1px solid var(--line-strong);
  padding: 8px 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text);
  position: relative;
  font-weight: 500;
  border-radius: 4px;
}

.chain-box.fixed {
  color: var(--text-faint);
  border-style: dashed;
}

.chain-badge {
  position: absolute;
  top: -28px;
  left: 50%;
  transform: translateX(-50%);
  width: 22px;
  height: 22px;
  background: var(--mapping);
  color: var(--bg);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  box-shadow: 0 0 12px var(--mapping-dim);
}

/* Tags pool */
.tags-pool-container {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  padding: 16px 20px;
  margin-bottom: 32px;
  display: flex;
  align-items: center;
  gap: 20px;
  border-radius: 8px;
}

.tags-pool-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  flex-shrink: 0;
}

.tags-pool {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  flex: 1;
  min-height: 36px;
  align-items: center;
}

.select-tag {
  width: 36px;
  height: 36px;
  background: var(--bg);
  border: 2px solid var(--mapping);
  color: var(--mapping);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}

.select-tag:hover {
  background: var(--mapping-dim);
  transform: scale(1.1);
}

.select-tag.is-selected {
  background: var(--mapping);
  color: var(--bg);
  box-shadow: 0 0 0 4px var(--mapping-dim), 0 0 20px var(--mapping-dim);
  transform: scale(1.15);
}

/* Spectrum */
.spectrum-wrap {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  padding: 24px 20px 40px;
  margin-bottom: 24px;
  position: relative;
  border-radius: 8px;
}

.spectrum-axis-labels {
  display: flex;
  justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 0.05em;
  margin-bottom: 12px;
  text-transform: uppercase;
}

.spectrum-svg {
  width: 100%;
  height: 140px;
  display: block;
}

.spectrum-baseline {
  stroke: var(--line-strong);
  stroke-width: 1;
}

.spectrum-trace {
  fill: none;
  stroke: var(--mapping);
  stroke-width: 1.5;
  stroke-linejoin: round;
  stroke-linecap: round;
  filter: drop-shadow(0 0 8px var(--mapping-dim));
}

.spectrum-peak-hit {
  fill: transparent;
  cursor: pointer;
}

.spectrum-tooltip {
  position: absolute;
  background: var(--bg);
  border: 1px solid var(--mapping);
  padding: 8px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 20;
  white-space: nowrap;
  border-radius: 4px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

.spectrum-tooltip.visible { opacity: 1; }

.spectrum-tooltip .tt-ppm {
  color: var(--mapping);
  font-weight: 700;
  display: block;
  margin-bottom: 2px;
}

/* Signals list */
.signals-list {
  border-top: 1px solid var(--line);
}

.signal-row {
  display: grid;
  grid-template-columns: 80px 1fr 60px;
  gap: 20px;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  transition: all 0.2s;
}

.signal-row.correct {
  background: var(--success);
  background: linear-gradient(90deg, rgba(0, 224, 142, 0.15), transparent);
  border-left: 3px solid var(--success);
  padding-left: 14px;
}

.signal-row.wrong {
  background: linear-gradient(90deg, rgba(255, 84, 84, 0.1), transparent);
  border-left: 3px solid var(--error);
}

.signal-ppm {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.02em;
}

.signal-ppm small {
  font-size: 11px;
  color: var(--text-faint);
  font-weight: 400;
  margin-left: 2px;
}

.signal-meta {
  display: flex;
  gap: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-dim);
}

.signal-meta span b {
  color: var(--text);
  font-weight: 500;
}

.dropzone {
  width: 44px;
  height: 44px;
  border: 2px dashed var(--line-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
  justify-self: end;
  border-radius: 6px;
}

.dropzone:hover {
  border-color: var(--mapping);
  background: var(--mapping-dim);
}

.dropzone.zone-filled {
  border-style: solid;
  border-color: var(--mapping);
  background: var(--mapping-dim);
}

.dropzone .placeholder {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text-faint);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* Feedback */
.feedback {
  margin-top: 32px;
  padding: 24px 28px;
  border-left: 3px solid var(--success);
  background: linear-gradient(90deg, rgba(0, 224, 142, 0.1), transparent);
  border-radius: 0 8px 8px 0;
}

.feedback.error {
  border-left-color: var(--error);
  background: linear-gradient(90deg, rgba(255, 84, 84, 0.08), transparent);
}

.feedback-title {
  font-family: 'Fraunces', serif;
  font-size: 20px;
  margin-bottom: 8px;
  font-weight: 500;
}

.feedback-body {
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1.5;
}

.feedback-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

/* Buttons */
.btn {
  background: transparent;
  border: 1px solid var(--line-strong);
  color: var(--text);
  padding: 14px 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
  flex: 1;
  border-radius: 6px;
}

.btn:hover:not(:disabled) {
  border-color: var(--text);
  background: var(--bg-elev);
}

.btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.btn.primary {
  background: var(--mapping);
  border-color: var(--mapping);
  color: var(--bg);
  font-weight: 600;
}

.btn.primary:hover:not(:disabled) {
  background: var(--text);
  border-color: var(--text);
  box-shadow: 0 0 20px var(--mapping-dim);
}

/* Solo */
.solo-toggle {
  display: inline-flex;
  border: 1px solid var(--line);
  margin-bottom: 24px;
  border-radius: 6px;
  overflow: hidden;
}

.solo-toggle button {
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 10px 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
}

.solo-toggle button.active {
  background: var(--solo-dim);
  color: var(--solo);
}

.solo-options {
  border-top: 1px solid var(--line);
  margin-top: 24px;
}

.option-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--line);
  color: var(--text);
  padding: 20px 0;
  font-family: 'Fraunces', serif;
  font-size: 17px;
  cursor: pointer;
  transition: all 0.2s;
  line-height: 1.4;
}

.option-btn:hover:not(:disabled) {
  padding-left: 14px;
  color: var(--solo);

<body>
<div class="app-shell">

<header>
  <div class="brand" onclick="setView('home')">
    <span class="brand-mark">Motor <em>RMN</em></span>
    <span class="brand-meta">Rev. 2026.08 · Build 0.5</span>
  </div>
  <div class="xp-readout">
    <div class="xp-icon">⚡</div>
    <div class="xp-info">
      <span class="xp-label">Score</span>
      <span class="xp-value mono" id="xp-counter">0</span>
    </div>
  </div>
</header>

<main id="app-container"></main>

<div class="footer-meta">
  <span>¹H / ¹³C · Elucidação Espectral</span>
  <span id="footer-context">—</span>
</div>

</div>

<script>
const state = {
  xp: 0,
  currentView: 'home',
  activeMode: null,
  currentLevel: 1,
  activeSpectrumType: '1H',
  errors: 0,
  selectedTagId: null,
  mappingTier: null,
  lastMappingLevel: null
};

const db = { tutorial: [], mapping: [], solo: [] };

async function carregarDados() {
  const arquivos = ['tutorial', 'mapping', 'solo'];
  try {
    const respostas = await Promise.all(arquivos.map(n => fetch(`data/${n}.json`)));
    for (const r of respostas) if (!r.ok) throw new Error(`Falha: ${r.url}`);
    const dados = await Promise.all(respostas.map(r => r.json()));
    db.tutorial = dados[0]; db.mapping = dados[1]; db.solo = dados[2];
    return true;
  } catch (e) { console.error(e); return false; }
}

function aplicarRuido(signals) {
  return signals.map(s => ({
    ...s,
    ppm: parseFloat((s.ppm + (Math.random() - 0.5) * 0.08).toFixed(2)),
    int: parseFloat(Math.max(0.1, s.int + (Math.random() - 0.5) * s.int * 0.2).toFixed(1)),
    height: Math.round(s.height * (0.9 + Math.random() * 0.2))
  }));
}

function updateXP(amount) {
  state.xp += amount;
  const el = document.getElementById('xp-counter');
  el.innerText = state.xp;
  el.classList.add('pulse');
  setTimeout(() => el.classList.remove('pulse'), 400);
}

function setView(viewName, mode = null, level = 1) {
  state.currentView = viewName;
  if (mode) state.activeMode = mode;
  if (level) state.currentLevel = level;
  state.errors = 0;
  state.activeSpectrumType = '1H';
  state.selectedTagId = null;
  render();
}

function render() {
  const c = document.getElementById('app-container');
  c.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'view-container fade-in';
  
  if (state.currentView === 'home') wrap.appendChild(renderHome());
  else if (state.currentView === 'modeSelect') wrap.appendChild(renderLevelSelect());
  else if (state.currentView === 'tutorial') wrap.appendChild(renderTutorial());
  else if (state.currentView === 'gameplay') {
    if (state.activeMode === 'mapping') wrap.appendChild(renderMapping());
    else wrap.appendChild(renderSolo());
  }
  
  c.appendChild(wrap);
  updateFooterContext();
}

function updateFooterContext() {
  const el = document.getElementById('footer-context');
  if (state.currentView === 'home') el.innerText = 'Início';
  else if (state.currentView === 'tutorial') el.innerText = `Tutorial · ${state.currentLevel}/${db.tutorial.length}`;
  else if (state.currentView === 'gameplay') {
    const q = db[state.activeMode].find(x => x.level === state.currentLevel);
    el.innerText = q ? `${state.activeMode === 'mapping' ? 'Atribuição' : 'Solo'} · ${q.title}` : '—';
  }
}

function renderHome() {
  const div = document.createElement('div');
  const totalMolecules = db.mapping.length;
  const progressPercent = Math.min(100, (state.xp / 500) * 100);
  
  div.innerHTML = `
    <div class="home-header">
      <div class="home-eyebrow">Ferramenta de ensino · v0.5</div>
      <h1 class="home-title">Pare de decorar.<br><em>Comece a analisar espectros.</em></h1>
      <p class="home-sub">Elucidação estrutural por RMN com moléculas reais do mercado farmacêutico. Ganhe pontos, suba de nível, domine a espectroscopia.</p>
      
      <div class="global-progress">
        <div class="progress-label">
          <span>Progresso geral</span>
          <span>${state.xp} / 500 pts</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: ${progressPercent}%"></div>
        </div>
      </div>
    </div>
    
    <div class="modes-grid">
      <button class="mode-row tutorial" onclick="setView('tutorial', null, 1)">
        <span class="mode-num">01</span>
        <div class="mode-body">
          <h3>Fundamentos</h3>
          <p>Revisão dos conceitos: ppm, Karplus, n+1, filtros DEPT. Base teórica para elucidação.</p>
        </div>
        <span class="mode-arrow">→</span>
      </button>
      
      <div class="mode-row mapping has-children">
        <span class="mode-num">02</span>
        <div class="mode-body">
          <h3>Atribuição H/C</h3>
          <p>Associe cada próton ou carbono ao sinal correspondente. ${totalMolecules} moléculas disponíveis, sorteio aleatório.</p>
        </div>
        <span class="mode-arrow"></span>
      </div>
      <div class="submodes">
        <button class="submode-btn" onclick="iniciarMappingAleatorio('facil')">
          <span class="tier-label">Tier 01</span>
          <div class="tier-name">Fácil</div>
          <div class="tier-desc">Cadeias curtas, 3 atribuições</div>
        </button>
        <button class="submode-btn" onclick="iniciarMappingAleatorio('medio')">
          <span class="tier-label">Tier 02</span>
          <div class="tier-name">Médio</div>
          <div class="tier-desc">Grupos funcionais, aromáticos</div>
        </button>
        <button class="submode-btn" onclick="iniciarMappingAleatorio('dificil')">
          <span class="tier-label">Tier 03</span>
          <div class="tier-name">Difícil</div>
          <div class="tier-desc">IFAs complexos, 6+ atribuições</div>
        </button>
      </div>
      
      <button class="mode-row solo" onclick="setView('modeSelect', 'solo')">
        <span class="mode-num">03</span>
        <div class="mode-body">
          <h3>Desafio Solo</h3>
          <p>Espectros puros, sem pistas. Identifique a estrutura. Erros penalizam o score.</p>
        </div>
        <span class="mode-arrow">→</span>
      </button>
    </div>
  `;
  return div;
}

function renderLevelSelect() {
  const div = document.createElement('div');
  const levels = db.solo;
  let rows = levels.map((l, i) => `
    <button class="mode-row solo" onclick="setView('gameplay', 'solo', ${l.level})">
      <span class="mode-num">${String(i + 1).padStart(2, '0')}</span>
      <div class="mode-body">
        <h3>${l.title}</h3>
        <p>${l.context}</p>
      </div>
      <span class="mode-arrow">→</span>
    </button>
  `).join('');
  
  div.innerHTML = `
    <button class="back-btn" onclick="setView('home')">Retornar</button>
    <div class="section-header" style="margin-top: 20px;">
      <span class="section-num">Seção 03</span>
      <h2 class="section-title">Desafio <em>Solo</em></h2>
    </div>
    <div class="modes-grid" style="border-top: 1px solid var(--line);">${rows}</div>
  `;
  return div;
}

window.iniciarMappingAleatorio = function(tier) {
  const pool = db.mapping.filter(m => m.tier === tier);
  if (!pool.length) return;
  let c = pool;
  if (pool.length > 1 && state.lastMappingLevel !== null) {
    c = pool.filter(m => m.level !== state.lastMappingLevel);
  }
  const escolhido = c[Math.floor(Math.random() * c.length)];
  state.lastMappingLevel = escolhido.level;
  state.mappingTier = tier;
  setView('gameplay', 'mapping', escolhido.level);
};

function renderTutorial() {
  const data = db.tutorial.find(t => t.level === state.currentLevel);
  const div = document.createElement('div');
  const prev = state.currentLevel > 1
    ? `<button class="btn-text" onclick="setView('tutorial', null, ${state.currentLevel - 1})">← Anterior</button>`
    : `<span></span>`;
  const next = state.currentLevel < db.tutorial.length
    ? `<button class="btn-text primary" onclick="setView('tutorial', null, ${state.currentLevel + 1})">Próxima base →</button>`
    : `<button class="btn-text primary" onclick="setView('home')">Concluir →</button>`;
  
  div.innerHTML = `
    <button class="back-btn" onclick="setView('home')">Retornar</button>
    <div class="section-header" style="margin-top: 20px;">
      <span class="section-num">Seção 01 · Base ${String(state.currentLevel).padStart(2, '0')}/${String(db.tutorial.length).padStart(2, '0')}</span>
      <h2 class="section-title">${data.title}</h2>
    </div>
    <div class="tutorial-body">${data.content}</div>
    <div class="tutorial-nav">${prev}${next}</div>
  `;
  return div;
}

function renderSpectrumSVG(signals, maxPpm, is13C = false) {
  const width = 1000;
  const height = 140;
  const baseline = height - 10;
  const maxH = height - 20;
  
  const sorted = [...signals].sort((a, b) => b.ppm - a.ppm);
  let path = `M 0 ${baseline}`;
  
  sorted.forEach(sig => {
    const x = ((maxPpm - sig.ppm) / maxPpm) * width;
    const peakH = Math.min(Math.abs(sig.height) * 1.5, maxH);
    const peakY = sig.height < 0 ? baseline + peakH * 0.3 : baseline - peakH;
    const w = 8;
    path += ` L ${x - w} ${baseline} L ${x} ${peakY} L ${x + w} ${baseline}`;
  });
  
  path += ` L ${width} ${baseline}`;
  
  const step = is13C ? 20 : 1;
  let ticks = '';
  for (let i = 0; i <= maxPpm; i += step) {
    const x = ((maxPpm - i) / maxPpm) * width;
    ticks += `<line x1="${x}" y1="${baseline}" x2="${x}" y2="${baseline + 4}" stroke="var(--line-strong)" stroke-width="1"/>`;
  }
  
  let hits = '';
  sorted.forEach((sig, i) => {
    const x = ((maxPpm - sig.ppm) / maxPpm) * width;
    hits += `<rect class="spectrum-peak-hit" data-idx="${i}" x="${x - 12}" y="0" width="24" height="${height}"/>`;
  });
  
  const color = is13C ? '#60A5FA' : 'var(--mapping)';
  
  return `
    <svg class="spectrum-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
      <line class="spectrum-baseline" x1="0" y1="${baseline}" x2="${width}" y2="${baseline}"/>
      ${ticks}
      <path class="spectrum-trace" d="${path}" style="stroke: ${color}"/>
      ${hits}
    </svg>
  `;
}

function deriveTagsFromChain(chain) {
  const tags = [];
  let c = 1;
  chain.forEach(item => {
    if (item.tagId) {
      tags.push({ id: item.tagId, label: String(c), correctTarget: item.correctTarget });
      c++;
    }
    (item.branches || []).forEach(b => {
      if (b.tagId) {
        tags.push({ id: b.tagId, label: String(c), correctTarget: b.correctTarget });
        c++;
      }
    });
  });
  return tags;
}

function renderChainDiagram(chain, tagNumbers) {
  const nodes = chain.map(item => {
    const num = item.tagId ? tagNumbers[item.tagId] : null;
    const badge = num ? `<div class="chain-badge">${num}</div>` : '';
    
    const branches = (item.branches || []).map(b => {
      const bNum = b.tagId ? tagNumbers[b.tagId] : null;
      const bBadge = bNum ? `<div class="chain-badge" style="top:-24px;width:18px;height:18px;font-size:10px;">${bNum}</div>` : '';
      return `
        <div class="chain-branch">
          ${bBadge}
          <div class="chain-branch-box" style="position:relative;">${b.label}</div>
          <div class="chain-branch-line"></div>
        </div>
      `;
    }).join('');
    
    return `
      <div class="chain-node">
        ${branches ? `<div class="chain-node-branches">${branches}</div>` : ''}
        <div class="chain-box ${item.fixed ? 'fixed' : ''}" style="position:relative;">
          ${badge}
          ${item.label}
        </div>
      </div>
    `;
  }).join('<div class="chain-link"></div>');
  
  return `<div class="chain-diagram"><div class="chain-inner">${nodes}</div></div>`;
}

function renderMapping() {
  const q = db.mapping.find(x => x.level === state.currentLevel);
  const tags = deriveTagsFromChain(q.chain);
  const tagNumbers = {};
  tags.forEach(t => tagNumbers[t.id] = t.label);
  q._derivedTags = tags;
  
  const signals = aplicarRuido(q.signals);
  const shuffledSignals = [...signals].sort(() => Math.random() - 0.5);
  const shuffledTags = [...tags].sort(() => Math.random() - 0.5);
  
  const tagsHtml = shuffledTags.map(t =>
    `<div class="select-tag" id="${t.id}" data-tagid="${t.id}">${t.label}</div>`
  ).join('');
  
  const signalsHtml = shuffledSignals.map(sig => `
    <div class="signal-row" id="row-${sig.id}" data-signalid="${sig.id}">
      <div class="signal-ppm">${sig.ppm}<small>ppm</small></div>
      <div class="signal-meta">
        <span>Mult: <b>${sig.mult}</b></span>
        <span>Int: <b>${sig.int}</b></span>
        ${sig.J ? `<span>J: <b>${sig.J}</b></span>` : ''}
      </div>
      <div class="dropzone" id="drop-${sig.id}" data-signalid="${sig.id}">
        <span class="placeholder">—</span>
      </div>
    </div>
  `).join('');
  
  const tierLabel = { facil: 'Tier 01 · Fácil', medio: 'Tier 02 · Médio', dificil: 'Tier 03 · Difícil' }[q.tier] || '';
  
  const div = document.createElement('div');
  div.innerHTML = `
    <button class="back-btn" onclick="setView('home')">Retornar</button>
    <div class="section-header" style="margin-top: 20px;">
      <span class="section-num">Seção 02 · ${tierLabel}</span>
      <h2 class="section-title">${q.title}</h2>
    </div>
    
    <div class="context-strip">
      <strong>${q.title}</strong>
      ${q.context}
    </div>
    
    <div class="instruction">Toque num número da estrutura e depois no sinal correspondente. Para reposicionar, toque na peça alocada e escolha nova zona.</div>
    
    ${renderChainDiagram(q.chain, tagNumbers)}
    
    <div class="tags-pool-container">
      <span class="tags-pool-label">Atribuições</span>
      <div class="tags-pool" id="tags-pool">${tagsHtml}</div>
    </div>
    
    <div class="spectrum-wrap">
      <div class="spectrum-axis-labels">
        <span>Desblindado · Baixo campo</span>
        <span>Blindado · Alto campo</span>
      </div>
      ${renderSpectrumSVG(signals, q.maxPpm)}
      <div class="spectrum-tooltip" id="spectrum-tooltip"></div>
    </div>
    
    <div class="signals-list">${signalsHtml}</div>
    
    <div id="mapping-feedback"></div>
    
    <button class="btn primary" id="btn-validate" onclick="validateMapping()" disabled style="margin-top: 32px; width: 100%;">Validar atribuição</button>
  `;
  
  setTimeout(() => attachMappingEvents(q, signals), 0);
  
  return div;
}

function attachMappingEvents(q, signals) {
  document.querySelectorAll('.select-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      const id = tag.dataset.tagid;
      if (state.selectedTagId === id) {
        tag.classList.remove('is-selected');
        state.selectedTagId = null;
        return;
      }
      document.querySelectorAll('.select-tag').forEach(t => t.classList.remove('is-selected'));
      tag.classList.add('is-selected');
      state.selectedTagId = id;
    });
  });
  
  document.querySelectorAll('.dropzone').forEach(dz => {
    dz.addEventListener('click', () => {
      const sigId = dz.dataset.signalid;
      if (state.selectedTagId) {
        const tagEl = document.getElementById(state.selectedTagId);
        const origin = tagEl.parentElement;
        const existing = dz.querySelector('.select-tag');
        if (existing && existing.id !== tagEl.id) {
          document.getElementById('tags-pool').appendChild(existing);
        }
        dz.innerHTML = '';
        dz.appendChild(tagEl);
        dz.classList.add('zone-filled');
        tagEl.classList.remove('is-selected');
        state.selectedTagId = null;
        if (origin && origin.classList.contains('dropzone') && origin !== dz) {
          origin.innerHTML = '<span class="placeholder">—</span>';
          origin.classList.remove('zone-filled');
        }
        checkMappingState();
      } else {
        const placed = dz.querySelector('.select-tag');
        if (placed) {
          document.querySelectorAll('.select-tag').forEach(t => t.classList.remove('is-selected'));
          placed.classList.add('is-selected');
          state.selectedTagId = placed.id;
        }
      }
    });
  });
  
  document.getElementById('tags-pool').addEventListener('click', (e) => {
    const tagHit = e.target.closest('.select-tag');
    if (tagHit) {
      document.querySelectorAll('.select-tag').forEach(t => t.classList.remove('is-selected'));
      tagHit.classList.add('is-selected');
      state.selectedTagId = tagHit.id;
      return;
    }
    if (state.selectedTagId) {
      const tagEl = document.getElementById(state.selectedTagId);
      const origin = tagEl.parentElement;
      tagEl.classList.remove('is-selected');
      document.getElementById('tags-pool').appendChild(tagEl);
      state.selectedTagId = null;
      if (origin && origin.classList.contains('dropzone') && origin.id !== 'tags-pool') {
        origin.innerHTML = '<span class="placeholder">—</span>';
        origin.classList.remove('zone-filled');
      }
      checkMappingState();
    }
  });
  
  const tooltip = document.getElementById('spectrum-tooltip');
  const wrap = document.querySelector('.spectrum-wrap');
  document.querySelectorAll('.spectrum-peak-hit').forEach(hit => {
    hit.addEventListener('mouseenter', (e) => {
      const idx = parseInt(hit.dataset.idx);
      const sig = signals[idx];
      tooltip.innerHTML = `<span class="tt-ppm">${sig.ppm} ppm</span>${sig.mult} · Int ${sig.int}${sig.J ? ` · J ${sig.J}Hz` : ''}`;
      tooltip.classList.add('visible');
    });
    hit.addEventListener('mousemove', (e) => {
      const rect = wrap.getBoundingClientRect();
      tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
      tooltip.style.top = (e.clientY - rect.top - 40) + 'px';
    });
    hit.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
  });
}

function checkMappingState() {
  const pool = document.getElementById('tags-pool');
  const btn = document.getElementById('btn-validate');
  if (!pool || !btn) return;
  btn.disabled = pool.children.length > 0;
}

window.validateMapping = function() {
  const q = db.mapping.find(x => x.level === state.currentLevel);
  const tags = q._derivedTags;
  let allCorrect = true;
  
  tags.forEach(t => {
    const dz = document.getElementById(`drop-${t.correctTarget}`);
    const tagEl = document.getElementById(t.id);
    const row = document.getElementById(`row-${t.correctTarget}`);
    if (dz && dz.contains(tagEl)) {
      row.classList.add('correct');
    } else {
      allCorrect = false;
      const parent = tagEl.parentElement;
      if (parent && parent.classList.contains('dropzone')) {
        parent.closest('.signal-row').classList.add('wrong', 'shake-err');
        setTimeout(() => parent.closest('.signal-row').classList.remove('shake-err'), 400);
      }
    }
  });
  
  const fb = document.getElementById('mapping-feedback');
  if (allCorrect) {
    const earned = Math.max(30, 150 - state.errors * 40);
    updateXP(earned);
    
    // Celebração visual
    const wrap = document.querySelector('.view-container');
    wrap.classList.add('success-pulse');
    setTimeout(() => wrap.classList.remove('success-pulse'), 600);
    
    fb.innerHTML = `
      <div class="feedback">
        <div class="feedback-title" style="color: var(--success);">✓ Atribuição validada · +${earned} pts</div>
        <div class="feedback-body">Lógica estrutural confirmada. Todos os deslocamentos químicos coerentes com a estrutura proposta.</div>
        <div class="feedback-actions">
          <button class="btn primary" onclick="iniciarMappingAleatorio('${state.mappingTier}')">Nova molécula</button>
          <button class="btn" onclick="setView('home')">Retornar</button>
        </div>
      </div>
    `;
    document.getElementById('btn-validate').style.display = 'none';
  } else {
    state.errors++;
    fb.innerHTML = `
      <div class="feedback error">
        <div class="feedback-title" style="color: var(--error);">✗ Atribuição incorreta</div>
        <div class="feedback-body">Os deslocamentos não correspondem aos ambientes químicos assinalados. Reavalie os efeitos eletrônicos e reinicie as peças incorretas.</div>
      </div>
    `;
    setTimeout(() => {
      tags.forEach(t => {
        const dz = document.getElementById(`drop-${t.correctTarget}`);
        const tagEl = document.getElementById(t.id);
        if (!dz.contains(tagEl)) {
          document.getElementById('tags-pool').appendChild(tagEl);
          const row = tagEl.closest('.signal-row');
          if (row) {
            row.classList.remove('wrong');
            const parentDz = row.querySelector('.dropzone');
            parentDz.innerHTML = '<span class="placeholder">—</span>';
            parentDz.classList.remove('zone-filled');
          }
        }
      });
      checkMappingState();
      fb.innerHTML = '';
    }, 2200);
  }
};

window.toggleSpectrum = type => { state.activeSpectrumType = type; render(); };

window.handleSoloAnswer = function(optionId, btnEl) {
  const q = db.solo.find(x => x.level === state.currentLevel);
  const opt = q.options.find(o => o.id === optionId);
  const fb = document.getElementById('feedback-box');
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  
  if (opt.correct) {
    btnEl.classList.add('correct');
    const earned = Math.max(20, 200 - state.errors * 70);
    updateXP(earned);
    
    const wrap = document.querySelector('.view-container');
    wrap.classList.add('success-pulse');
    setTimeout(() => wrap.classList.remove('success-pulse'), 600);
    
    fb.innerHTML = `
      <div class="feedback">
        <div class="feedback-title" style="color: var(--success);">✓ Diagnóstico exato · +${earned} pts</div>
        <div class="feedback-body">${opt.feedback}</div>
        <div class="feedback-actions">
          <button class="btn primary" onclick="setView('modeSelect', 'solo')">Próxima missão</button>
        </div>
      </div>
    `;
  } else {
    state.errors++;
    btnEl.classList.add('wrong');
    fb.innerHTML = `
      <div class="feedback error">
        <div class="feedback-title" style="color: var(--error);">✗ Lógica falha</div>
        <div class="feedback-body">${opt.feedback}</div>
      </div>
    `;
    setTimeout(() => btns.forEach(b => { if (!b.classList.contains('wrong')) b.disabled = false; }), 900);
  }
};

function renderSolo() {
  const q = db.solo.find(x => x.level === state.currentLevel);
  const div = document.createElement('div');
  
  const hasToggle = Object.keys(q.spectra).length > 1;
  const toggleHtml = hasToggle ? `
    <div class="solo-toggle">
      <button class="${state.activeSpectrumType === '1H' ? 'active' : ''}" onclick="toggleSpectrum('1H')">Varredura ¹H</button>
      <button class="${state.activeSpectrumType === '13C' ? 'active' : ''}" onclick="toggleSpectrum('13C')">Varredura ¹³C</button>
    </div>
  ` : '';
  
  const is13C = state.activeSpectrumType === '13C';
  const specData = q.spectra[state.activeSpectrumType];
  const spectrumHtml = renderSpectrumSVG(specData.signals, specData.maxPpm, is13C);
  
  const optionsHtml = q.options.map(o =>
    `<button class="option-btn" onclick="handleSoloAnswer('${o.id}', this)">${o.text}</button>`
  ).join('');
  
  div.innerHTML = `
    <button class="back-btn" onclick="setView('modeSelect', 'solo')">Retornar</button>
    <div class="section-header" style="margin-top: 20px;">
      <span class="section-num">Seção 03 · Missão ${String(state.currentLevel).padStart(2, '0')}</span>
      <h2 class="section-title">${q.title}</h2>
    </div>
    
    <div class="context-strip" style="background: var(--solo-dim); border-left-color: var(--solo);">
      <strong>${q.title}</strong>
      ${q.context}
    </div>
    
    ${toggleHtml}
    
    <div class="spectrum-wrap">
      <div class="spectrum-axis-labels">
        <span>Baixo campo · Desblindado</span>
        <span>Alto campo · Blindado</span>
      </div>
      ${spectrumHtml}
    </div>
    
    <div style="margin-top: 32px;">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-faint); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 12px;">Estrutura molecular correspondente</div>
      <div class="solo-options">${optionsHtml}</div>
    </div>
    
    <div id="feedback-box" style="margin-top: 24px;"></div>
  `;
  
  return div;
}

async function iniciar() {
  const c = document.getElementById('app-container');
  c.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:60vh;color:var(--text-faint);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;">Carregando bases de dados…</div>`;
  const ok = await carregarDados();
  if (!ok) {
    c.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:12px;color:var(--error);font-family:'JetBrains Mono',monospace;font-size:12px;text-align:center;padding:20px;">
      <div>Falha ao carregar dados.</div>
      <div style="color:var(--text-faint);font-size:11px;">Confirme que data/tutorial.json, mapping.json e solo.json existem e que a página é servida via http.</div>
    </div>`;
    return;
  }
  render();
}

iniciar();
</script>
</body>
</html>

name: Lint data JSON

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'

jobs:
  validate-data:
    runs-on: ubuntu-latest
    name: Valida JSONs de dados

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validação estrutural e de notação
        run: node scripts/validate-data.mjs
